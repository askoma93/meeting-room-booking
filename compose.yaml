services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meeting_room_booking
      POSTGRES_USER: meeting_room
      POSTGRES_PASSWORD: meeting_room
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meeting_room -d meeting_room_booking']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: meeting_room_booking_test
      POSTGRES_USER: meeting_room_test
      POSTGRES_PASSWORD: meeting_room_test
    ports:
      - '5433:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U meeting_room_test -d meeting_room_booking_test',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
