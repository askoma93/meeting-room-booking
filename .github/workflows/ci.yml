name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: meeting_room_booking_test
          POSTGRES_USER: meeting_room_test
          POSTGRES_PASSWORD: meeting_room_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U meeting_room_test -d meeting_room_booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply test database migrations
        run: npm run db:test:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: API integration tests
        run: npm run test:api
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Required browser journeys
        run: npm run e2e
