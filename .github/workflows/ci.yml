name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: meeting_room_booking_test
          POSTGRES_USER: meeting_room_test
          POSTGRES_PASSWORD: meeting_room_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U meeting_room_test -d meeting_room_booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run db:test:migrate
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
